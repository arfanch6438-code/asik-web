<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f5f8;font:15px "Segoe UI",Roboto,Arial,sans-serif;color:#14181f}
form{background:#fff;padding:24px;border-radius:12px;width:min(340px,90vw);border:1px solid #d9dde5}h1{font-size:18px;margin:0 0 14px;color:#14234d}
input{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #d9dde5;border-radius:7px;font:inherit;box-sizing:border-box}
button{width:100%;padding:11px;background:#14234d;color:#fff;border:0;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}#e{color:#b3261e;margin-top:10px;min-height:18px}</style></head>
<body><form id="f"><h1>AL RASEKH LOGISTICS</h1><label>Username</label><input id="u" autocomplete="username" required><label>Password</label><input id="p" type="password" autocomplete="current-password" required><button>Login</button><div id="e"></div></form>
<script>document.getElementById("f").onsubmit=function(ev){ev.preventDefault();fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})}).then(function(r){return r.json().then(function(j){if(r.ok)location.href="/";else e.textContent=j.error||"Login failed";});}).catch(function(){e.textContent="Cannot reach server";});};</script></body></html>
